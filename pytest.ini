# Tooling only: `pytest` here runs every engine's suite, and the launcher's, against the installed
# packages (from a package's directory, its own settings test its src/ instead). Test files mirror
# each engine's source tree, so basenames repeat across directories and engines.
[pytest]
testpaths =
    engines/qwen3.6-35b-a3b-m2/tests
    engines/qwen3.6-35b-a3b-m4pro/tests
    engines/qwen3.8-flash-next-m4pro/tests
    engines/qwen3.8-flash-next-m2/tests
    engines/flint-m4pro/tests
    engines/flint-m2/tests
    launch/tests
addopts = --import-mode=importlib
