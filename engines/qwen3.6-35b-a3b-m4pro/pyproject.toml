[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jitengine-qwen3.6-35b-a3b-m4pro"
version = "0.1.0a1"
description = "Qwen3.6-35B-A3B, tuned on a 48 GB Apple M4 Pro: a serving engine synthesized by SkyDiscover"
readme = "README.md"
# The M4 Pro measurements ran on CPython 3.14.7 with mlx 0.32.2.
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "UC Berkeley Sky Computing Lab" }]
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 3 - Alpha",
]
# The model runtime is Apple-Silicon-only; on other platforms only help/version/config/policy work.
# mlx is pinned: the custom kernels are checked bit for bit against this version's stock ops.
dependencies = [
    "mlx==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # the MTP drafter builds its decoder layer from mlx-lm's qwen3_5 module
    "mlx-lm==0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=2.0",
    "transformers>=5.16,<6",
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://jitengine.ai"
Repository = "https://github.com/skydiscover-ai/jitengine"

[project.optional-dependencies]
download = ["huggingface_hub>=1.0"]
benchmark = ["mlx-lm==0.31.3", "httpx>=0.28"]
dev = ["pytest>=8", "openai>=3.37", "anthropic>=0.40"]  # the SDK tests in tests/unit/server/test_openai_compat.py

[project.scripts]
"jitengine-qwen3.6-35b-a3b-m4pro" = "jitengine_qwen3_6_35b_a3b_m4pro.cli:main"

[tool.setuptools.package-data]
jitengine_qwen3_6_35b_a3b_m4pro = ["profiles/*.json"]

[tool.pytest.ini_options]
# Tests import the package from this checkout's src/, whatever is installed; test files mirror the
# source tree, so a basename can repeat across directories.
addopts = ["--import-mode=importlib"]
pythonpath = ["src"]
testpaths = ["tests"]
