[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jitengine-flint-m4pro"
version = "0.1.0a1"
description = "Flint (int4) on a 48 GB Apple M4 Pro: a single-stream decode engine synthesized by SkyDiscover"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "UC Berkeley Sky Computing Lab" }]
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 3 - Alpha",
]
# The 48 GB M4 Pro build: Flint's engine (../flint, jitengine-flint, which install.sh installs beside it) under this build's
# command, with this Mac's results and end-to-end check.
dependencies = ["jitengine-flint==0.1.0a1"]

[project.urls]
Homepage = "https://jitengine.ai"
Repository = "https://github.com/skydiscover-ai/jitengine"

[project.optional-dependencies]
download = ["huggingface_hub>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
"jitengine-flint-m4pro" = "jitengine_flint_m4pro.cli:main"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["src"]
testpaths = ["tests"]
