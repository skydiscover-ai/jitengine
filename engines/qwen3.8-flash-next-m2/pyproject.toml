[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jitengine-qwen3.8-flash-next-m2"
version = "0.1.0a1"
description = "Qwen3.8-Flash-Next, tuned on a 24 GB Apple M2: a serving engine synthesized by SkyDiscover"
readme = "README.md"
# The M2 measurements ran on CPython 3.14 with mlx 0.32.2.
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "UC Berkeley Sky Computing Lab" }]
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 3 - Alpha",
]
# The model runtime is Apple-Silicon-only; elsewhere only the CLI's help and the pure planner work.
dependencies = [
    "mlx==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=2.0",
    "transformers>=5.17,<6",
    "jinja2>=3.1",  # renders the chat template
]

[project.urls]
Homepage = "https://jitengine.ai"
Repository = "https://github.com/skydiscover-ai/jitengine"

[project.optional-dependencies]
download = ["huggingface_hub>=1.0"]  # the `hf download` CLI
benchmark = ["httpx>=0.28"]  # benchmarks/benchmark.py; transformers is a dependency already
dev = ["pytest>=8", "openai>=3.37", "anthropic>=0.40"]  # the SDK tests in tests/unit/server/test_openai_compat.py

[project.scripts]
"jitengine-qwen3.8-flash-next-m2" = "jitengine_qwen3_8_flash_next_m2.cli:main"

[tool.pytest.ini_options]
# Tests import the package from this checkout's src/, whatever is installed; test files mirror the
# source tree, so a basename can repeat across directories.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
