[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jitengine-qwen3.8-flash-next-m4pro"
version = "0.1.0a1"
description = "Qwen3.8-Flash-Next, tuned on a 48 GB Apple M4 Pro: a serving engine synthesized by SkyDiscover"
readme = "README.md"
# The M4 Pro measurements ran on CPython 3.14 with mlx 0.32.2 and transformers 5.17.
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "UC Berkeley Sky Computing Lab" }]
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 3 - Alpha",
]
# The model runtime is Apple-Silicon-only; elsewhere only the CLI's help and the pure planner work.
dependencies = [
    "mlx==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=2.0",
    "transformers>=5.17,<6",
    "jinja2>=3.1",  # renders the chat template
]

[project.urls]
Homepage = "https://jitengine.ai"
Repository = "https://github.com/skydiscover-ai/jitengine"

[project.optional-dependencies]
download = ["huggingface_hub>=1.0"]  # the `hf download` CLI
benchmark = ["httpx>=0.28"]  # benchmarks/benchmark.py; transformers is a dependency already
dev = ["pytest>=8", "openai>=3.37", "anthropic>=0.40"]  # the SDK tests in tests/unit/server/test_openai_compat.py

[project.scripts]
"jitengine-qwen3.8-flash-next-m4pro" = "jitengine_qwen3_8_flash_next_m4pro.cli:main"

[tool.setuptools.package-data]
# the pack16 escape tables, keyed by checkpoint (moe/offload_cache/codec.py); the MTP draft's
# subset ids and their manifest (model/draft_vocab.py)
jitengine_qwen3_8_flash_next_m4pro = [
    "moe/offload_cache/pack16_escapes.json",
    "model/draft_vocab_ids.npy",
    "model/draft_vocab_ids.manifest.json",
]

[tool.pytest.ini_options]
# Tests import the package from this checkout's src/, whatever is installed; test files mirror the
# source tree, so a basename can repeat across directories.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
